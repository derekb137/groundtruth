target-version = "py311"
line-length = 100
src = ["packages", "scripts", "tests"]

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line too long (formatter handles)
    "B008",  # function call in default arg (FastAPI/Click idiom)
]

[lint.per-file-ignores]
"tests/**" = ["S101"]  # asserts ok in tests
"scripts/**" = ["T201"]  # prints ok in scripts

[format]
quote-style = "double"
indent-style = "space"
