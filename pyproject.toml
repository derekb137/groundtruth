[project]
name = "groundtruth"
version = "0.0.1"
description = "Drift-aware executable notebooks, open source, powered by a fact graph."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Derek B", email = "derek@distru.com" }]

dependencies = [
    "anthropic>=0.71.0",
    "claude-agent-sdk>=0.1.75",
    "mcp>=1.0",
    "crawl4ai>=0.8.0",
    "voyageai>=0.3.0",
    "deepeval>=2.0",
    "papermill>=2.6",
    "nbformat>=5.10",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "python-dotenv>=1.0",
    "pydantic>=2.8",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pre-commit>=4.0",
    "hypothesis>=6.115",
]

[project.scripts]
groundtruth-crawl = "scripts.crawl:main"
groundtruth-query = "scripts.query:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/core", "packages/courses", "packages/shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers -ra"
markers = [
    "integration: requires running Postgres + network",
    "slow: takes >5s",
    "evals: DeepEval-based, may call live LLMs",
]

[tool.coverage.run]
source = ["packages"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
# New repo — coverage rises as Waves 2+ land. Gate re-enabled at Phase 1.
fail_under = 0
